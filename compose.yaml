# Intentionally separate from docker-compose.e2e.yml. This profile builds the
# application image; the E2E fixture remains disposable and opt-in.
#
# This is not a public HTTP deployment. The server binds to its own loopback
# interface and this file deliberately has no `ports` section. See
# docs/container-deployment.md before using it.
services:
  netbox-mcp:
    profiles: ["deployment"]
    build:
      context: .
      args:
        VERSION: ${NETBOX_MCP_IMAGE_VERSION:-dev}
        REVISION: ${NETBOX_MCP_IMAGE_REVISION:-unknown}
        CREATED: ${NETBOX_MCP_IMAGE_CREATED:-unknown}
    image: ${NETBOX_MCP_IMAGE:-netbox-mcp:local}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      NETBOX_URL: ${NETBOX_URL:?NETBOX_URL is required}
      NETBOX_TOKEN_FILE: /run/secrets/netbox_token
      NETBOX_TRANSPORT: http
      # Override when publishing through a proxy or host port mapping.
      NETBOX_HTTP_ALLOWED_HOSTS: ${NETBOX_HTTP_ALLOWED_HOSTS:-localhost}
    secrets:
      - source: netbox_token
        target: netbox_token
        uid: "1000"
        gid: "1000"
        mode: 0400
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "Promise.all(['/healthz', '/readyz'].map((path) =>
          fetch('http://127.0.0.1:3000' + path).then((response) => {
          if (!response.ok) throw new Error(response.statusText);
          }))).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

secrets:
  netbox_token:
    file: ${NETBOX_TOKEN_FILE:?NETBOX_TOKEN_FILE is required}
