name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported Node majors on Linux x86, plus one job on every other
        # platform and architecture we claim to support. Claiming Windows,
        # macOS or ARM without a runner proving it is how a support matrix
        # becomes fiction — this repository has already shipped documentation
        # describing a product that did not exist.
        #
        # macos-14 and ubuntu-24.04-arm are ARM64 (Apple silicon, Graviton).
        include:
          - { os: ubuntu-latest, node: "20", label: "linux x64 · node 20" }
          - { os: ubuntu-latest, node: "22", label: "linux x64 · node 22" }
          - { os: ubuntu-24.04-arm, node: "22", label: "linux arm64 · node 22" }
          - { os: windows-latest, node: "22", label: "windows x64 · node 22" }
          - { os: macos-14, node: "22", label: "macos arm64 · node 22" }
          # macos-13 (Intel) is deliberately absent. It was tried: the job sat
          # queued with zero steps while every other runner finished, and
          # GitHub is retiring Intel macOS. A job that never gets scheduled
          # blocks every pull request and proves nothing, so macOS x86-64 is
          # documented as untested instead — see docs/compatibility.md.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # NODE_ENV is honoured by `npm ci`; a production value silently omits
      # devDependencies and every step below then fails for the wrong reason.
      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Report the platform under test
        run: node -e "console.log(process.platform, process.arch, 'node', process.version)"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Build BEFORE test. `tests/installation/package-contents.test.ts` asks
      # `npm pack` what would be published, and `files` points at `dist` — with
      # no build the tarball is documents only and the test fails for a reason
      # that has nothing to do with the change. It passed locally purely
      # because a previous build had left `dist/` lying around.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test -- --coverage

      # The published package is the contract. Verify the CLI contract against
      # the built artifact, not the source tree.
      #
      # Written in Node rather than shell so it runs identically on Windows,
      # where the previous `set -e` / `$?` version would not run at all.
      - name: Smoke test the built binary
        run: node scripts/smoke-cli.mjs

  container:
    name: Container build and Compose deployment profile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Build independently of the disposable NetBox E2E fixture. This proves
      # the production image and its un-published authenticated HTTP profile
      # without requiring a live NetBox or putting a credential in GitHub Actions.
      - name: Prepare an ephemeral file-backed secret
        run: |
          umask 077
          printf 'ci-placeholder-token\n' > "$RUNNER_TEMP/netbox-token"
          # File-backed Compose secrets are bind mounts on Docker Compose, which
          # does not apply the requested uid/gid/mode. This is a dummy CI value;
          # production must use a managed secret backend as the docs require.
          chmod 0444 "$RUNNER_TEMP/netbox-token"

      - name: Build the production image with traceable metadata
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag netbox-mcp:ci .
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' netbox-mcp:ci)" = "$GITHUB_SHA"

      - name: Validate and start the authenticated HTTP deployment profile
        env:
          NETBOX_URL: https://netbox.example.test
          NETBOX_TOKEN_FILE: ${{ runner.temp }}/netbox-token
          NETBOX_MCP_IMAGE: netbox-mcp:ci
          NETBOX_OIDC_ISSUER: https://issuer.example.test
          NETBOX_OIDC_JWKS_URL: https://issuer.example.test/jwks
          NETBOX_OIDC_AUDIENCE: netbox-mcp
          NETBOX_OIDC_REQUIRED_SCOPE: mcp
          NETBOX_OIDC_RESOURCE_URL: https://mcp.example.test/mcp
        run: |
          docker compose --profile deployment config
          docker compose --profile deployment up -d
          container_id="$(docker compose --profile deployment ps -q netbox-mcp)"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "${status:-}" = healthy
          published="$(docker compose --profile deployment port netbox-mcp 3000 2>/dev/null || true)"
          test -z "$published"

      - name: Stop the deployment profile
        if: always()
        env:
          NETBOX_URL: https://netbox.example.test
          NETBOX_TOKEN_FILE: ${{ runner.temp }}/netbox-token
          NETBOX_MCP_IMAGE: netbox-mcp:ci
          NETBOX_OIDC_ISSUER: https://issuer.example.test
          NETBOX_OIDC_JWKS_URL: https://issuer.example.test/jwks
          NETBOX_OIDC_AUDIENCE: netbox-mcp
          NETBOX_OIDC_REQUIRED_SCOPE: mcp
          NETBOX_OIDC_RESOURCE_URL: https://mcp.example.test/mcp
        run: docker compose --profile deployment down --volumes --remove-orphans

  netbox-e2e:
    name: NetBox fixture E2E (manual/opt-in)
    # Containers run only when manually dispatched or when repository variable
    # NETBOX_E2E is explicitly set to 1; ordinary pushes and PRs stay hermetic.
    if: github.event_name == 'workflow_dispatch' || vars.NETBOX_E2E == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Run disposable NetBox fixture E2E
        run: npm run test:e2e
        env:
          NETBOX_E2E: "1"
          NETBOX_E2E_COMPOSE_COMMAND: "docker compose"

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks CLI is open source and free. gitleaks-action is not: for a
      # repository owned by an organization it fails with "License key is
      # required", which is a billing message wearing the costume of a security
      # finding. Run the scanner directly and keep the check meaningful.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --verbose --exit-code 1
