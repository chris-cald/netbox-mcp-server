# Disposable NetBox fixture for tests/e2e/netbox-available-ips.e2e.test.ts.
# Values are generated by scripts/e2e-netbox.mjs; do not put credentials here.
services:
  postgres:
    image: postgres@sha256:53964f0d111d959109d9444640f4876b7b93e1bfff73716cfa93609dca582a66
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_E2E_DB_PASSWORD:?NETBOX_E2E_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox -d netbox"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  netbox:
    # scripts/e2e-netbox.mjs builds this pinned patched image after NETBOX_E2E=1.
    image: ${NETBOX_E2E_IMAGE:?NETBOX_E2E_IMAGE is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NETBOX_E2E_PORT:?NETBOX_E2E_PORT is required}:8080"
    environment:
      ALLOWED_HOSTS: "*"
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_E2E_DB_PASSWORD:?NETBOX_E2E_DB_PASSWORD is required}
      # PostgreSQL's first boot briefly accepts connections before its final restart.
      # Retry every five seconds for up to two minutes after Compose marks it healthy.
      DB_WAIT_TIMEOUT: "5"
      MAX_DB_WAIT_TIME: "120"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      SUPERUSER_NAME: e2e-admin
      SUPERUSER_PASSWORD: ${NETBOX_E2E_SUPERUSER_PASSWORD:?NETBOX_E2E_SUPERUSER_PASSWORD is required}
      SUPERUSER_API_TOKEN: ${NETBOX_E2E_TOKEN:?NETBOX_E2E_TOKEN is required}
      SUPERUSER_API_KEY: ${NETBOX_E2E_SUPERUSER_API_KEY:?NETBOX_E2E_SUPERUSER_API_KEY is required}
      SECRET_KEY: ${NETBOX_E2E_SECRET_KEY:?NETBOX_E2E_SECRET_KEY is required}
      # NetBox v4.6.7's container adapter creates API_TOKEN_PEPPERS[1] from this value.
      API_TOKEN_PEPPER_1: ${NETBOX_E2E_API_TOKEN_PEPPER_1:?NETBOX_E2E_API_TOKEN_PEPPER_1 is required}
    healthcheck:
      test:
        ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/status/ >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
